<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prompt Kütüphanesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

  <div class="cursor-glow" id="cursorGlow"></div>

  <nav class="navbar">
    <div class="nav-container">
      <a href="#" class="logo">PK<span class="logo-accent">.</span></a>
      <div class="nav-actions">
        <button class="lang-btn" id="langToggle" onclick="switchLang(currentLang === 'tr' ? 'en' : 'tr')">EN</button>
        <span id="promptCount" class="count-badge">0</span>
        <button class="btn btn-primary" id="addBtn"><i class="fas fa-plus"></i> Yeni Prompt</button>
      </div>
    </div>
  </nav>

  <main>
    <header class="hero">
      <h1>Prompt <span class="gradient">Kütüphanesi</span></h1>
      <p>En sevdiğin AI prompt'larını kaydet, kategorize et ve tekrar kullan.</p>
      <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="searchInput" placeholder="Prompt ara..." />
      </div>
    </header>

    <section class="filters">
      <button class="filter-btn active" data-filter="all">Tümü</button>
      <button class="filter-btn" data-filter="yazilim">Yazılım</button>
      <button class="filter-btn" data-filter="yaraticilik">Yaratıcılık</button>
      <button class="filter-btn" data-filter="egitim">Eğitim</button>
      <button class="filter-btn" data-filter="is">İş</button>
      <button class="filter-btn" data-filter="gunluk">Günlük</button>
    </section>

    <section class="prompts" id="promptsContainer">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-inbox"></i>
        <h3>Henüz prompt yok</h3>
        <p>İlk prompt'unu eklemek için yukarıdaki butonu kullan.</p>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Yeni Prompt</h2>
        <button class="modal-close" id="modalClose"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Başlık</label>
          <input type="text" id="promptTitle" placeholder="Prompt'a bir isim ver..." />
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="promptCategory">
            <option value="yazilim">Yazılım</option>
            <option value="yaraticilik">Yaratıcılık</option>
            <option value="egitim">Eğitim</option>
            <option value="is">İş</option>
            <option value="gunluk">Günlük Hayat</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prompt Metni</label>
          <textarea id="promptText" rows="6" placeholder="Prompt metnini buraya yapıştır..."></textarea>
        </div>
        <div class="form-group">
          <label>Açıklama <span class="optional">(opsiyonel)</span></label>
          <textarea id="promptDesc" rows="3" placeholder="Ne işe yaradığını kısaca açıkla..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" id="modalCancel">İptal</button>
        <button class="btn btn-primary" id="modalSave">Kaydet</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer class="site-footer">
    <p id="footerText">© 2025 Samet Erez Atmaca. Tüm hakları saklıdır.</p>
  </footer>

  <script src="assets/js/translations.js"></script>
  <script src="assets/js/prompts.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
